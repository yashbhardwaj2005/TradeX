services:
  - type: web
    name: tradex-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --workspace backend
    startCommand: npm start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.13.1
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: '1'
      - key: MARKET_PROVIDER
        value: simulated
      - key: WORKER_ENABLED
        value: 'false'
      - key: WORKER_INTERVAL_MS
        value: '15000'
